name: my-badges

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

permissions:
  contents: write
  actions: write

jobs:
  my-badges:
    runs-on: ubuntu-latest
    steps:
      - name: Update My Badges
        run: npx update-my-badges ${{github.repository_owner}}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # GitHub disables scheduled workflows after 60 days without repo activity; re-enabling resets that timer.
      - name: Keep the schedule alive
        if: always()
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/my-badges.yml/enable"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
